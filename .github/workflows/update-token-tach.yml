name: Update Token Tach

on:
  repository_dispatch:
    types: [token-tach-release]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: tap-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Resolve latest release and checksum
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/release.json"
          gh api repos/phall1/token-tach/releases/latest > "$release"
          tag="$(jq -er '.tag_name' "$release")"
          [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          version="${BASH_REMATCH[1]}"
          name="token-tach-$version-universal2.dmg"
          [[ "$(jq --arg name "$name" '[.assets[] | select(.name == $name)] | length' "$release")" == 1 ]]
          url="$(jq -er --arg name "$name" '.assets[] | select(.name == $name) | .browser_download_url' "$release")"
          [[ "$url" == "https://github.com/phall1/token-tach/releases/download/$tag/$name" ]]
          curl --fail --silent --show-error --location "$url" --output "$RUNNER_TEMP/$name"
          sha256="$(sha256sum "$RUNNER_TEMP/$name" | cut -d ' ' -f 1)"
          [[ "$sha256" =~ ^[0-9a-f]{64}$ ]]

          {
            echo "TAG=$tag"
            echo "VERSION=$version"
            echo "SHA256=$sha256"
          } >> "$GITHUB_ENV"

      - name: Render cask
        run: |
          set -euo pipefail
          cat > Casks/token-tach.rb <<RUBY
          cask "token-tach" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/phall1/token-tach/releases/download/v#{version}/token-tach-#{version}-universal2.dmg",
                verified: "github.com/phall1/token-tach/"
            name "Token Tach"
            desc "Menu-bar tachometer for AI coding-agent token usage and subscription limits"
            homepage "https://github.com/phall1/token-tach"

            livecheck do
              url :url
              strategy :github_latest
            end

            depends_on macos: :big_sur

            app "token-tach.app"
            binary "#{staged_path}/token-tach-shim", target: "token-tach"

            preflight do
              shim = staged_path/"token-tach-shim"
              shim.write <<~SH
                #!/bin/sh
                exec "#{appdir}/token-tach.app/Contents/MacOS/token-tach" "\$@"
              SH
              shim.chmod 0755
            end

            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-dr", "com.apple.quarantine", "#{appdir}/token-tach.app"],
                             sudo: false
            end

            zap trash: [
              "~/.config/token-tach",
              "~/.local/state/token-tach",
            ]

            caveats <<~EOS
              Token Tach is a menu-bar accessory app with no Dock icon.
              Launch it from Applications, then use its menu-bar item.

              This build is ad-hoc signed. The cask clears its quarantine flag
              so macOS can launch it without a Developer ID certificate.
            EOS
          end
          RUBY
          ruby -c Casks/token-tach.rb

      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: "Brew cask update for Token Tach ${{ env.TAG }}"
          file_pattern: Casks/token-tach.rb

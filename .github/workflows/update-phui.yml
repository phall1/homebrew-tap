name: Update phui

on:
  repository_dispatch:
    types: [phui-release]
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

concurrency:
  group: update-phui
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Resolve latest release and checksums
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/release.json"
          gh api repos/phall1/phui/releases/latest > "$release"
          tag="$(jq -er '.tag_name' "$release")"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

          asset_sha256() {
            local name="$1" url destination digest count
            count="$(jq --arg name "$name" '[.assets[] | select(.name == $name)] | length' "$release")" || return 1
            [[ "$count" == 1 ]] || return 1
            url="$(jq -er --arg name "$name" '.assets[] | select(.name == $name) | .browser_download_url' "$release")" || return 1
            [[ "$url" == "https://github.com/phall1/phui/releases/download/$tag/$name" ]] || return 1
            destination="$RUNNER_TEMP/$name"
            curl --fail --silent --show-error --location "$url" --output "$destination" || return 1
            digest="$(sha256sum "$destination" | cut -d ' ' -f 1)" || return 1
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || return 1
            printf '%s\n' "$digest"
          }

          darwin_arm64_sha256="$(asset_sha256 phui-darwin-arm64.tar.gz)"
          darwin_x64_sha256="$(asset_sha256 phui-darwin-x64.tar.gz)"
          linux_arm64_sha256="$(asset_sha256 phui-linux-arm64.tar.gz)"
          linux_x64_sha256="$(asset_sha256 phui-linux-x64.tar.gz)"
          for digest in "$darwin_arm64_sha256" "$darwin_x64_sha256" "$linux_arm64_sha256" "$linux_x64_sha256"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          done
          {
            echo "TAG=$tag"
            echo "DARWIN_ARM64_SHA256=$darwin_arm64_sha256"
            echo "DARWIN_X64_SHA256=$darwin_x64_sha256"
            echo "LINUX_ARM64_SHA256=$linux_arm64_sha256"
            echo "LINUX_X64_SHA256=$linux_x64_sha256"
          } >> "$GITHUB_ENV"

      - name: Render formula
        run: |
          set -euo pipefail
          cat > Formula/phui.rb <<RUBY
          class Phui < Formula
            desc "Terminal UI for GitHub pull requests, issues, diffs, and Actions"
            homepage "https://github.com/phall1/phui"

            livecheck do
              url :stable
              strategy :github_latest
            end

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/phall1/phui/releases/download/${TAG}/phui-darwin-arm64.tar.gz"
                sha256 "${DARWIN_ARM64_SHA256}"
              else
                url "https://github.com/phall1/phui/releases/download/${TAG}/phui-darwin-x64.tar.gz"
                sha256 "${DARWIN_X64_SHA256}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/phall1/phui/releases/download/${TAG}/phui-linux-arm64.tar.gz"
                sha256 "${LINUX_ARM64_SHA256}"
              else
                url "https://github.com/phall1/phui/releases/download/${TAG}/phui-linux-x64.tar.gz"
                sha256 "${LINUX_X64_SHA256}"
              end
            end

            def install
              bin.install "phui"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/phui --version")
            end
          end
          RUBY
          ruby -c Formula/phui.rb

      - name: Commit update with race-safe retry
        run: bash .github/scripts/commit-update.sh Formula/phui.rb "Brew formula update for phui $TAG"
